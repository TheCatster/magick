[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magick"
version = "1.0.0"
description = "Merge Helvault and Moxfield CSV exports into one de-duplicated MTG collection"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
magick = "magick.cli:main"

[tool.setuptools]
packages = ["magick"]
